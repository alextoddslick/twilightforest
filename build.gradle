plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = (hasProperty("CIRevision") ? CIRevision : project.mod_version)
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    // Twilight Forest targets Java 17 for MC 1.20.1.
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    // Generate a sources jar for downstream debugging.
    withSourcesJar()
}

loom {
    // Forge access transformer (src/main/resources/META-INF/accesstransformer.cfg) was
    // converted to a Fabric access widener. See that file for the SRG→Mojmap migration notes.
    accessWidenerPath = file("src/main/resources/twilightforest.accesswidener")

    runs {
        client {
            client()
            ideConfigGenerated true
            runDir "run"
        }
        server {
            server()
            ideConfigGenerated true
            runDir "run"
        }
        // Fabric datagen entrypoint (replaces Forge GatherDataEvent). Wired up in the datagen phase.
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/generated/resources")}"
            vmArg "-Dfabric-api.datagen.modid=twilightforest"
            runDir "build/datagen"
        }
    }
}

// Datagen output is bundled as resources (matches the Forge branch layout).
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

repositories {
    maven { name 'Fabric';        url 'https://maven.fabricmc.net/' }
    maven { name 'Parchment';     url 'https://maven.parchmentmc.org' }
    // ── Fabric-ecosystem compat mavens (enable as compat modules are ported) ──
    // Trinkets (replaces Curios)
    maven { name 'Ladysnake';     url 'https://maven.ladysnake.org/releases' }   // Cardinal Components, Trinkets dep
    maven { name 'Shedaniel';     url 'https://maven.shedaniel.me/' }            // Cloth Config
    maven { name 'TerraformersMC'; url 'https://maven.terraformersmc.com/releases/' } // Mod Menu, Trinkets
    maven { name 'Curseforge';    url 'https://www.cursemaven.com'
        content { includeGroup "curse.maven" } }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // OFFICIAL MOJANG MAPPINGS — keeps vanilla names identical to the Forge source.
    // Parchment (param names) can be layered on later via loom.layered { ... }.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // ── Compat dependencies — uncomment per porting phase (see HANDOFF.md) ────
    // modImplementation "dev.emi:trinkets:${project.trinkets_version}"                 // Curios → Trinkets
    // modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    // modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"
    // modApi "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"  // Forge config → Cloth
    // modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    // modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:..."        // JEI (Fabric)
    // modCompileOnly "curse.maven:jade-324717:..."                                     // Jade / WTHIT (TOP replacement)
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
    // NOTE: the Forge branch built with "-Werror -Xlint:all". That is intentionally
    // dropped during the port so the large migration can land incrementally without
    // every deprecation warning failing the build. Re-tighten once the port compiles.
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        // Loom remaps the jar; publish target intentionally left as local until release.
        mavenLocal()
    }
}
