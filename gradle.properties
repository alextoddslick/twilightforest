# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# ─── Fabric / Minecraft (port target) ───────────────────────────────────────
# Ported from Forge 1.19.2 → Fabric 1.20.1. Uses OFFICIAL MOJANG MAPPINGS so the
# ~120k lines of vanilla calls (already written against Mojmap via Parchment on
# the Forge branch) compile with minimal renaming; only Forge-specific APIs change.
minecraft_version=1.20.1
loader_version=0.15.11

# Fabric API (final 1.20.1 release)
fabric_version=0.92.2+1.20.1

# ─── Mod Properties ─────────────────────────────────────────────────────────
mod_version=4.2.0-fabric-port
mod_id=twilightforest
maven_group=com.github.teamtwilight.twilightforest
archives_base_name=twilightforest

# ─── Optional Fabric ecosystem deps (Curios→Trinkets, Cloth Config, etc.) ────
# Pinned here for the porting phases that need them; uncomment in build.gradle as wired up.
# trinkets_version=3.7.2
# cardinal_components_version=5.2.2
# cloth_config_version=11.1.118
# modmenu_version=7.2.2
